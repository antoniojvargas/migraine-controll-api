# Plantilla de secretos/config sensible para desplegar con Serverless Framework.
#
# serverless.yml NO carga este archivo directamente: lee cada valor desde el
# entorno del shell vía ${env:VAR}. Este YAML es solo una referencia de qué
# variables hacen falta y con qué forma, para que cada quien las exporte
# (shell profile, CI secrets, un gestor de secretos, etc.) antes de correr
# `npm run sls:deploy`.
#
# Uso sugerido en local:
#   1. cp secrets.example.yml secrets.yml   (secrets.yml queda en .gitignore, nunca se commitea)
#   2. Completa los valores reales en secrets.yml
#   3. export $(grep -v '^#' secrets.yml | sed 's/: /=/' | xargs) && npm run sls:deploy
#
# En CI, cada variable se inyecta como secret del pipeline (no se usa este archivo).

# --- Base de datos (PostgreSQL) ---
DB_HOST: db.example.internal
DB_PORT: '5432'
DB_USER: migraine_control_app
DB_PASSWORD: <db-password>
DB_NAME: migraine_control

# --- Autenticación ---
JWT_SECRET: <jwt-signing-secret>
COGNITO_USER_POOL_ID: <cognito-user-pool-id>
# Pool legado, solo si aplica migración de usuarios entre user pools.
COGNITO_LEGACY_USER_POOL_ID: <cognito-legacy-user-pool-id>

# --- S3 (bundle de CA para conexiones TLS a DocumentDB) ---
CA_BUNDLE_KEY: global-bundle.pem

# --- DocumentDB (datos crudos de wearables vía Terra) ---
DOCUMENTDB_ENABLED: 'false'
DOCUMENTDB_URI: <documentdb-connection-uri>
DOCUMENTDB_DATABASE: terra
DOCUMENTDB_COLLECTION: health_data

# --- Observabilidad ---
SENTRY_DSN: <sentry-dsn>

# --- Región AWS (opcional, tiene default en serverless.yml) ---
AWS_REGION: us-east-1
