AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Migraine Control API - Cognito User Pool con triggers Lambda
  (Pre-SignUp, Post-Confirmation, Post-Authentication).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Entorno de despliegue.

  UserPoolName:
    Type: String
    Default: migraine-control-user-pool
    Description: Nombre base del User Pool (se sufija con el Stage).

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      Bucket S3 con el artefacto empaquetado (zip) de dist/infra/aws/cognito-triggers,
      generado por `npm run build`.

  LambdaCodeS3Key:
    Type: String
    Description: Key del zip dentro del bucket (ej. cognito-triggers/{version}.zip).

Resources:
  CognitoTriggersExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${UserPoolName}-${Stage}-triggers-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${UserPoolName}-${Stage}-pre-sign-up'
      Runtime: nodejs20.x
      Handler: pre-sign-up.handler
      Role: !GetAtt CognitoTriggersExecutionRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  PostConfirmationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${UserPoolName}-${Stage}-post-confirmation'
      Runtime: nodejs20.x
      Handler: post-confirmation.handler
      Role: !GetAtt CognitoTriggersExecutionRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  PostAuthenticationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${UserPoolName}-${Stage}-post-authentication'
      Runtime: nodejs20.x
      Handler: post-authentication.handler
      Role: !GetAtt CognitoTriggersExecutionRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${UserPoolName}-${Stage}'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
        PostAuthentication: !GetAtt PostAuthenticationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${UserPoolName}-${Stage}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PostAuthenticationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostAuthenticationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

Outputs:
  UserPoolId:
    Description: ID del User Pool
    Value: !Ref UserPool
  UserPoolArn:
    Description: ARN del User Pool
    Value: !GetAtt UserPool.Arn
  UserPoolClientId:
    Description: ID del App Client
    Value: !Ref UserPoolClient
